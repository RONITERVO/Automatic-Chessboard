name: Controller firmware

permissions:
  contents: read

on:
  push:
    paths:
      - "*.ino"
      - "*.h"
      - "*.cpp"
      - "firmware/**"
      - "hardware/connections.csv"
      - "hardware/mks-gen-l-v1-connections.csv"
      - "hardware/sensor-map.csv"
      - "hardware/validate.ps1"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "*.ino"
      - "*.h"
      - "*.cpp"
      - "firmware/**"
      - "hardware/connections.csv"
      - "hardware/mks-gen-l-v1-connections.csv"
      - "hardware/sensor-map.csv"
      - "hardware/validate.ps1"
      - ".github/workflows/firmware.yml"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate, test, compile, and enforce Nano and MKS resource budgets
        shell: pwsh
        run: ./firmware/test.ps1 -InstallDependencies
