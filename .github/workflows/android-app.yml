name: Android app

on:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android_app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Unit tests, lint, and compile check
        working-directory: android_app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # The normal CI compile intentionally omits the 114 MB Stockfish binary.
      # Release builds must run the verified downloader and publish the complete
      # official sf_18 source tar with the APK to meet GPL obligations.
