name: Android app

on:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/android-app.yml"
  pull_request:
    paths:
      - "android_app/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Unit tests, lint, and compile check
        working-directory: android_app
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # The normal CI compile intentionally omits the 114 MB Stockfish binary.
      # Release builds must run the verified downloader and publish the complete
      # official sf_18 source tar with the APK to meet GPL obligations.
