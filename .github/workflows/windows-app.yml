name: Windows companion

permissions:
  contents: read

on:
  push:
    paths:
      - "windows_app/**"
      - ".github/workflows/windows-app.yml"
  pull_request:
    paths:
      - "windows_app/**"
      - ".github/workflows/windows-app.yml"

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows_app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            windows_app/requirements.txt
            windows_app/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: python -m ruff check .
      - name: Build public Windows folder
        shell: pwsh
        run: .\build.ps1
      - name: Upload tested Windows folder and release ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenAutomaticChessboard-windows
          path: |
            windows_app/dist/OpenAutomaticChessboard
            windows_app/dist/OpenAutomaticChessboard-*-windows*.zip
          if-no-files-found: error
