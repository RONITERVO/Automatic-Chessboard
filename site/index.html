<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <meta name="description" content="Interactive three-dimensional Automatic Chessboard build explorer" />
    <title>Automatic Chessboard</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main id="viewport" aria-label="Interactive three-dimensional automatic chessboard">
      <canvas id="scene" aria-label="Rotatable automatic chessboard model"></canvas>

      <div id="loading" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M18 53h31v5H14v-2c0-2 2-3 4-3Zm7-6c-5-7-4-16 2-22l-4-6 15-9c1 8 7 10 9 18 2 7-1 15-7 19H25Zm10-25-4 2 4 3 4-3-4-2Z" />
        </svg>
      </div>

      <nav id="toolbar" aria-label="Model controls">
        <button id="reset-view" type="button" aria-label="Reset camera">
          <svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9Z" /></svg>
        </button>
        <button id="toggle-explode" type="button" aria-label="Toggle exploded view" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="m12 3 8 4-8 4-8-4 8-4Zm8 9-8 4-8-4m16 5-8 4-8-4" /></svg>
        </button>
        <button id="toggle-xray" type="button" aria-label="Toggle transparent board" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Zm10-3a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z" /></svg>
        </button>
        <button id="toggle-wiring" type="button" aria-label="Toggle guided wiring" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h5v4h6V7h5M4 17h5v-4h6v4h5M4 4v6m16-6v6M4 14v6m16-6v6" /></svg>
        </button>
        <button id="restore-hidden" type="button" aria-label="Restore manually hidden parts">
          <svg viewBox="0 0 24 24"><path d="M3 3 21 21M10.6 5.2A9.9 9.9 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3 4M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7c1 0 2-.2 2.8-.5M9.9 9.9A3 3 0 0 0 14.1 14" /></svg>
        </button>
      </nav>

      <button id="progress" type="button" aria-label="Toggle purchased parts visibility" aria-pressed="false">
        <svg viewBox="0 0 52 52" aria-hidden="true">
          <circle class="track" cx="26" cy="26" r="20" />
          <circle class="value" cx="26" cy="26" r="20" />
          <path d="m17 27 6 6 13-14" />
        </svg>
      </button>

      <section id="wiring-guide" aria-label="Guided wiring steps" hidden>
        <div id="wiring-step-bar">
          <button id="wiring-previous" type="button" aria-label="Previous wiring step">
            <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" /></svg>
          </button>
          <div id="wiring-step-status">
            <svg id="wiring-step-icon" viewBox="0 0 24 24" aria-hidden="true"><path id="wiring-step-icon-path" /></svg>
            <output id="wiring-step-index" aria-live="polite"></output>
          </div>
          <button id="wiring-next" type="button" aria-label="Complete step and continue">
            <svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" /></svg>
          </button>
        </div>
        <div id="wiring-step-track" aria-label="Wiring progress"></div>
        <div id="wiring-pin-codes" aria-live="polite"></div>
      </section>

      <section id="part-actions" aria-label="Selected component actions" hidden>
        <i id="part-swatch" aria-hidden="true"></i>
        <button id="open-part" type="button" aria-label="Open selected component recommendation">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M19 13v7H4V5h7" /></svg>
        </button>
        <button id="mark-purchased" type="button" aria-label="Mark selected component purchased and hide it" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></svg>
        </button>
        <button id="hide-part" type="button" aria-label="Hide selected component">
          <svg viewBox="0 0 24 24"><path d="M3 3 21 21M10.6 5.2A9.9 9.9 0 0 1 12 5c6 0 10 7 10 7a18 18 0 0 1-3 4M6.2 6.2C3.6 8 2 12 2 12s4 7 10 7c1 0 2-.2 2.8-.5M9.9 9.9A3 3 0 0 0 14.1 14" /></svg>
        </button>
        <button id="clear-selection" type="button" aria-label="Clear selection">
          <svg viewBox="0 0 24 24"><path d="M6 6 18 18M18 6 6 18" /></svg>
        </button>
      </section>

      <div id="pointer-mark" aria-hidden="true"></div>
      <div id="announcer" class="sr-only" aria-live="polite"></div>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
