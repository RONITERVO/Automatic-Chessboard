<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Automatic chessboard power and protection wiring</title>
  <desc id="desc">A protected 24 volt supply feeds two stepper drivers, the electromagnet, and a five volt buck converter. All returns share one ground distribution point.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#cf222e"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0969da"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#1f2328}.sub{font:16px Arial,sans-serif;fill:#59636e}.box{fill:#fff;stroke:#30363d;stroke-width:2;rx:12}.protect{fill:#fff3cd;stroke:#9a6700}.power{fill:#ffebe9;stroke:#cf222e}.logic{fill:#ddf4ff;stroke:#0969da}.ground{fill:#f6f8fa;stroke:#57606a}.head{font:700 18px Arial,sans-serif;fill:#1f2328}.text{font:15px Arial,sans-serif;fill:#1f2328}.small{font:13px Arial,sans-serif;fill:#59636e}.p24{stroke:#cf222e;stroke-width:6;fill:none;marker-end:url(#arrow-red)}.p5{stroke:#0969da;stroke-width:6;fill:none;marker-end:url(#arrow-blue)}.gnd{stroke:#30363d;stroke-width:5;fill:none}.branch{stroke:#cf222e;stroke-width:4;fill:none;marker-end:url(#arrow-red)}
    </style>
  </defs>
  <rect width="1400" height="860" fill="#ffffff"/>
  <text class="title" x="55" y="55">Power and protection — public build</text>
  <text class="sub" x="55" y="83">Protected +24 V is red, regulated +5 V is blue, and the common return is black.</text>

  <rect class="box power" x="55" y="140" width="180" height="105"/>
  <text class="head" x="145" y="178" text-anchor="middle">24 V DC supply</text>
  <text class="text" x="145" y="204" text-anchor="middle">3 A minimum</text>
  <text class="small" x="145" y="227" text-anchor="middle">5 A recommended</text>

  <rect class="box protect" x="285" y="140" width="165" height="105"/>
  <text class="head" x="367" y="178" text-anchor="middle">F1 main fuse</text>
  <text class="text" x="367" y="204" text-anchor="middle">3 A time-delay</text>
  <text class="small" x="367" y="227" text-anchor="middle">≥ 32 V DC</text>

  <rect class="box protect" x="500" y="140" width="190" height="105"/>
  <text class="head" x="595" y="178" text-anchor="middle">Latching cutoff</text>
  <text class="text" x="595" y="204" text-anchor="middle">reachable locally</text>
  <text class="small" x="595" y="227" text-anchor="middle">≥ 30 V DC, ≥ 5 A</text>

  <rect class="box protect" x="740" y="140" width="220" height="105"/>
  <text class="head" x="850" y="178" text-anchor="middle">Reverse-polarity</text>
  <text class="text" x="850" y="204" text-anchor="middle">protection</text>
  <text class="small" x="850" y="227" text-anchor="middle">≥ 30 V DC, ≥ 5 A</text>

  <rect class="box power" x="1010" y="140" width="215" height="105"/>
  <text class="head" x="1117" y="178" text-anchor="middle">+24 V distribution</text>
  <text class="text" x="1117" y="204" text-anchor="middle">covered terminals</text>
  <text class="small" x="1117" y="227" text-anchor="middle">18 AWG / 0.75 mm² trunk</text>

  <path class="p24" d="M235 192 H285"/><path class="p24" d="M450 192 H500"/><path class="p24" d="M690 192 H740"/><path class="p24" d="M960 192 H1010"/>

  <rect class="box power" x="990" y="330" width="260" height="105"/>
  <text class="head" x="1120" y="365" text-anchor="middle">Driver 1 — VMOT</text>
  <text class="text" x="1120" y="392" text-anchor="middle">100 µF / 50 V at pins</text>
  <text class="small" x="1120" y="416" text-anchor="middle">capacitor stripe → GND</text>
  <path class="branch" d="M1080 245 V330"/>

  <rect class="box power" x="990" y="480" width="260" height="105"/>
  <text class="head" x="1120" y="515" text-anchor="middle">Driver 2 — VMOT</text>
  <text class="text" x="1120" y="542" text-anchor="middle">100 µF / 50 V at pins</text>
  <text class="small" x="1120" y="566" text-anchor="middle">capacitor stripe → GND</text>
  <path class="branch" d="M1180 245 V285 H1300 V532 H1250"/>

  <rect class="box power" x="690" y="330" width="245" height="105"/>
  <text class="head" x="812" y="365" text-anchor="middle">H2520 magnet</text>
  <text class="text" x="812" y="392" text-anchor="middle">24 V / 2.8 W</text>
  <text class="small" x="812" y="416" text-anchor="middle">flyback stripe → +24 V</text>
  <path class="branch" d="M1045 245 V290 H812 V330"/>

  <rect class="box protect" x="405" y="330" width="180" height="105"/>
  <text class="head" x="495" y="365" text-anchor="middle">Logic fuse</text>
  <text class="text" x="495" y="392" text-anchor="middle">1 A</text>
  <text class="small" x="495" y="416" text-anchor="middle">DC rated</text>
  <path class="branch" d="M1018 245 V285 H495 V330"/>

  <rect class="box logic" x="405" y="480" width="180" height="105"/>
  <text class="head" x="495" y="515" text-anchor="middle">24 V → 5 V buck</text>
  <text class="text" x="495" y="542" text-anchor="middle">adjust to 5.00 V</text>
  <text class="small" x="495" y="566" text-anchor="middle">≥ 1 A continuous</text>
  <path class="p24" d="M495 435 V480"/>

  <rect class="box logic" x="105" y="480" width="235" height="105"/>
  <text class="head" x="222" y="515" text-anchor="middle">+5 V logic rail</text>
  <text class="text" x="222" y="542" text-anchor="middle">Nano 5V — not VIN</text>
  <text class="small" x="222" y="566" text-anchor="middle">MUX, LCD, BLE, driver VDD</text>
  <path class="p5" d="M405 532 H340"/>

  <rect class="box ground" x="105" y="700" width="1145" height="95"/>
  <text class="head" x="677" y="735" text-anchor="middle">COMMON GND DISTRIBUTION</text>
  <text class="text" x="677" y="762" text-anchor="middle">Supply −, buck IN−/OUT−, Nano GND, driver logic and motor GND, MUX/LCD/BLE GND, TIP120 emitter</text>
  <text class="small" x="677" y="783" text-anchor="middle">Use a low-resistance distribution point. Do not route motor return current through thin sensor wiring.</text>

  <path class="gnd" d="M145 245 V700"/><path class="gnd" d="M222 585 V700"/><path class="gnd" d="M495 585 V700"/><path class="gnd" d="M812 435 V700"/><path class="gnd" d="M1120 435 H965 V700"/><path class="gnd" d="M1120 585 H1270 V700"/>

  <rect x="1265" y="145" width="85" height="35" rx="7" fill="#fff3cd" stroke="#9a6700"/><text class="small" x="1307" y="168" text-anchor="middle">required</text>
  <text class="small" x="1265" y="207">Cutoff removes power</text><text class="small" x="1265" y="227">from every branch.</text>
</svg>
